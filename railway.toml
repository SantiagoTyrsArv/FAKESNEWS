# API service (root directory: apps/api). The start command is the
# Dockerfile CMD, which binds to Railway's $PORT.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["uv run --frozen alembic upgrade head"]
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
