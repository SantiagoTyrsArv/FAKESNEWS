# SonarCloud automatic analysis.
#
# azureresourcemanager:S6378 asks for an identity block on every resource. The
# log alert in infra/modules/alerts.bicep has none on purpose: Azure Monitor
# runs the query with its own access to the workspace, and an identity would
# need a role assignment the deploy identity (Contributor) cannot create.
sonar.issue.ignore.multicriteria=alertidentity
sonar.issue.ignore.multicriteria.alertidentity.ruleKey=azureresourcemanager:S6378
sonar.issue.ignore.multicriteria.alertidentity.resourceKey=infra/modules/alerts.bicep
