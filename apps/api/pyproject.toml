[project]
name = "fakesnews-api"
version = "0.1.0"
description = "API backend for the AI-assisted news credibility verification platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "cryptography>=43.0.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "trafilatura>=1.12.0",
    "yt-dlp>=2024.11.0",
    "faster-whisper>=1.0.3",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
