allowBuilds:
  unrs-resolver: true
onlyBuiltDependencies:
  - unrs-resolver
# Security floors for transitive dependencies flagged by OSV-Scanner
# (see docs/SEGURIDAD.md). Same major only, except minimatch: its fix only
# exists in 11, and its two consumers (typescript-estree, @ts-morph/common)
# only call minimatch(), which 11 keeps. Drop each once its parent package
# resolves a fixed version on its own.
overrides:
  source-map-js: ^1.2.2
  zod@^4: ^4.6.6
  hono: ^4.13.11
  ip-address: ^10.7.4
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  undici@^7: ^7.30.1
  minimatch@^10: ^11.0.4
