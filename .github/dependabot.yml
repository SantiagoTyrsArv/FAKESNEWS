# Weekly update PRs. Actions are pinned to commit SHAs (supply-chain safety),
# so Dependabot is what keeps those SHAs moving.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      # Types must match the Node the app runs on (22: Dockerfile, CI);
      # newer majors would allow APIs that don't exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
