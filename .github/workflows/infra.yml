name: infra

# Deploys infra/main.bicep. It keeps the image the apps are running, so an
# infrastructure change never rolls the API back to an older build.
# infra/bootstrap.bicep (identities, role assignments, Key Vault) is deployed
# by hand: the deploy identity cannot create role assignments.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared with infra.yml/api-deploy.yml: the two never run at once, so infra
# never reads the image tag mid-rollout and redeploys the old one on top.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-fakesnews-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy main.bicep
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          IMAGE=$(az containerapp show -g "$RESOURCE_GROUP" -n ca-fakesnews-api \
            --query "properties.template.containers[0].image" -o tsv --only-show-errors)
          TAG=${IMAGE##*:}
          echo "keeping image tag: $TAG"
          az deployment group create -g "$RESOURCE_GROUP" -n main \
            -f infra/main.bicep -p infra/main.bicepparam -p imageTag="$TAG" \
            --query properties.provisioningState -o tsv
