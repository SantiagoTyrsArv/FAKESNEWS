name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as apps/api/Dockerfile.
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # Wheels only and no project install, like the Dockerfile: nothing runs a
      # package's build scripts. pytest finds the app through pythonpath.
      - run: uv sync --frozen --no-install-project --no-build
      - run: uv run --frozen --no-sync --no-build ruff check .
      - run: uv run --frozen --no-sync --no-build ruff format --check .
      - run: uv run --frozen --no-sync --no-build python -m pytest -q
