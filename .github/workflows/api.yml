name: api

# Runs on every PR, because branch protection requires it: a required check
# that never starts would block the PR forever. The `changes` job skips the
# work when the API isn't touched, and a skipped job counts as passed.
# On main, api-deploy.yml calls this workflow before deploying.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ] || gh pr diff "$PR" --repo "$REPO" --name-only |
            grep -qE '^(apps/api/|\.github/workflows/api(-deploy)?\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  api-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as apps/api/Dockerfile.
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # Wheels only and no project install, like the Dockerfile: nothing runs a
      # package's build scripts. pytest finds the app through pythonpath.
      - run: uv sync --frozen --no-install-project --no-build
      - run: uv run --frozen --no-sync --no-build ruff check .
      - run: uv run --frozen --no-sync --no-build ruff format --check .
      - run: uv run --frozen --no-sync --no-build python -m pytest -q
